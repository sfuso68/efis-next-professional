# CANDIDATE ONLY. Replaces the mutable build/dev launcher.
[Service]
WorkingDirectory=/home/pi/efis-next-current
ExecStartPre=/usr/bin/install -d -m 0755 /home/pi/.local/state/efis-next/ems /home/pi/.local/state/efis-next/ems/captures
Environment=EFIS_ENGINE_RUNTIME_STATE=/home/pi/.local/state/efis-next/ems/engine-runtime.state
Environment=EFIS_BLACKBOX_FUEL_EVENTS=/home/pi/.local/state/efis-next/ems/blackbox-fuel-events.jsonl
Environment=EFIS_CAPTURE_DIR=/home/pi/.local/state/efis-next/ems/captures
Environment=EFIS_RECORDER_STATUS=/home/pi/.local/state/efis-next/recorder.status
ExecCondition=/usr/bin/python3 /usr/local/lib/efis-next/validate_release_manifest.py --manifest /home/pi/efis-next-current/release-manifest.json --release-root /home/pi/efis-next-current --expected-role EMS --expected-platform RPI4_AARCH64 --check-files
ExecStart=
ExecStart=/home/pi/efis-next-current/bin/efis-ems-qt
