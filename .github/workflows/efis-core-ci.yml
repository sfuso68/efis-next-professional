name: EFIS Core CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'ci/**'
      - 'work/**'
      - 'integration/**'
      - 'test/**'

permissions:
  contents: read

jobs:
  linux-qt-golden:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: '1'
      QSG_RHI_BACKEND: opengl
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Qt 6.8.2 with Quick 3D
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: '6.8.2'
          modules: 'qtquick3d qtquicktimeline qtshadertools'
          # A module-blind cache can restore Qt base without Qt6Quick3D and
          # make CMake fail even though the requested module is declared.
          cache: false

      - name: Configure Qt renderer
        run: >-
          cmake -S . -B build/linux-qt -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DEFIS_BUILD_QT_RENDERER=ON
          -DEFIS_REQUIRE_QT_RENDERER=ON
          -DEFIS_BUILD_TESTS=ON

      - name: Build Qt renderer
        run: cmake --build build/linux-qt --target efis-pfd-qt --parallel 4

      - name: Capture bootstrap candidate or verify committed Linux baseline
        shell: bash
        run: |
          set -euo pipefail
          reference=tests/golden/ems-responsive-states-linux
          if [[ -f "$reference/manifest.json" ]]; then
            ctest --test-dir build/linux-qt --output-on-failure \
              -R '^efis_ems_golden_rerender_tests$'
          else
            python3 tools/ui/capture_ems_responsive_state_matrix.py \
              --executable build/linux-qt/efis-pfd-qt \
              --output-dir build/linux-golden-candidate \
              --platform offscreen \
              --delay-ms 1200
            echo 'Linux golden baseline is absent; candidate artifact created for review.'
          fi

      - name: Upload Linux golden candidate
        if: ${{ !cancelled() && hashFiles('tests/golden/ems-responsive-states-linux/manifest.json') == '' }}
        uses: actions/upload-artifact@v6
        with:
          name: ems-responsive-states-linux-candidate
          path: build/linux-golden-candidate
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload failed Linux rerender for diagnosis
        if: ${{ failure() && hashFiles('tests/golden/ems-responsive-states-linux/manifest.json') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: ems-responsive-states-linux-failed-rerender
          path: build/linux-qt/linux-golden-rerender
          if-no-files-found: error
          retention-days: 7

  linux-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure core without Qt
        run: >-
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DEFIS_BUILD_QT_RENDERER=OFF
          -DEFIS_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/ci --parallel 4

      - name: Test
        run: ctest --test-dir build/ci --output-on-failure --timeout 60

  linux-sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure core with AddressSanitizer and UndefinedBehaviorSanitizer
        run: >-
          cmake -S . -B build/sanitizers -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DEFIS_BUILD_QT_RENDERER=OFF
          -DEFIS_BUILD_TESTS=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build sanitizer targets
        run: cmake --build build/sanitizers --parallel 4

      - name: Test under sanitizers
        run: ctest --test-dir build/sanitizers --output-on-failure --timeout 90
