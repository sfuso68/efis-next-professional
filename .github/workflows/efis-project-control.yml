name: EFIS Project Control

on:
  pull_request:
  push:
    branches:
      - main
      - 'work/**'
      - 'integration/**'
      - 'docs/**'
      - 'safety/**'

permissions:
  contents: read

jobs:
  project-control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate matrix and generated status
        run: |
          python -m unittest tests.test_project_status_control -v
          python -m unittest tests.test_git_restore_drill -v
          python tools/project_status/generate_status.py --check

      - name: Validate G1 sensor-node discovery contract
        run: |
          python tools/hardware/validate_g1_sensor_node_discovery.py
          python -m unittest tests.test_g1_sensor_node_discovery -v
          python -m unittest tests.test_capture_g1_sensor_node -v
          python tools/hardware/validate_g1_physical_inventory.py
          python -m unittest tests.test_g1_physical_inventory -v
          python -m unittest tests.test_g1_visual_inventory_import -v
          python tools/network/validate_g1_upstream_proposal.py
          python -m unittest tests.test_g1_upstream_proposal -v
          python tools/network/validate_g1_switch_acceptance.py
          python -m unittest tests.test_g1_switch_acceptance -v
          python tools/hardware/validate_g1_g2_readiness.py
          python -m unittest tests.test_g1_g2_readiness -v

      - name: Validate G2 ICD and live-vertical contract
        run: |
          python tools/protocol/validate_avionix_icd.py --bundle docs/status/evidence/g2-arm64-consolidated-20260918/evidence.json
          python -m unittest tests.test_avionix_icd -v
          python tools/network/validate_g2_vertical_acceptance.py
          python -m unittest tests.test_g2_vertical_acceptance -v

      - name: Validate qualification batch G1-G4
        run: |
          python tools/qualification/validate_qualification_batch.py
          python -m unittest tests.test_qualification_batch -v

      - name: Validate SkyView and EMS HMI contract
        run: |
          python tools/ui/validate_hmi_contract.py
          python -m unittest tests.test_avionix_hmi_contract -v
          python -m unittest tests.test_skyview_responsive -v
          python -m unittest tests.test_ems_state_presentation -v
          python -m unittest tests.test_ems_responsive_state_matrix -v
          python -m unittest tests.test_hmi_hardware_acceptance -v
          python -m unittest tests.test_assemble_hmi_hardware_evidence -v
          python -m unittest tests.test_hmi_golden_tools -v
          python tools/ui/validate_ems_state_presentation.py
          python tools/ui/validate_ems_responsive_state_matrix.py
          python tools/ui/validate_hmi_hardware_acceptance.py
          python tools/ui/validate_hmi_golden.py tests/golden/hmi
          python tools/ui/validate_hmi_golden.py tests/golden/skyview

      - name: Validate immutable release and supervision contract
        run: |
          python -m unittest tests.test_release_manifest -v
          python -m unittest tests.test_release_supervision_assets -v
          python -m unittest tests.test_release_preparation -v
          python -m unittest tests.test_paired_display_release -v

      - name: Validate AVIONIX data and network contracts
        run: |
          python tools/protocol/validate_data_contract.py
          python tools/network/validate_avionics_network.py config/network/avionics-network-v1.json
          python -m unittest tests.test_avionix_data_contract -v

      - name: Validate product safety contracts
        run: |
          python tools/product/validate_product_contracts_batch.py
          python -m unittest tests.test_product_contracts_batch -v
          python tools/product/validate_product_tools_batch.py
          python -m unittest tests.test_product_tools_batch -v
          python tools/product/validate_product_evidence_batch.py
          python -m unittest tests.test_product_evidence_batch -v
          python tools/product/validate_product_review_gates.py
          python -m unittest tests.test_product_review_gates -v
          python -m unittest tests.test_package_product_evidence -v
          python tools/product/validate_product_independent_review.py
          python -m unittest tests.test_product_evidence_review -v
          python -m unittest tests.test_manage_product_evidence_session -v

      - name: Determine changed files
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD^"
            fi
          fi
          git diff --name-only "$BASE" HEAD > /tmp/efis_changed_files.txt
          cat /tmp/efis_changed_files.txt

      - name: Require project status update for subsystem changes
        run: |
          python tools/project_status/check_status_update.py --file-list /tmp/efis_changed_files.txt

      - name: Show generated summary
        run: cat docs/status/EFIS_NEXT_STATUS_GENERATED.md
