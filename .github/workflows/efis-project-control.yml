name: EFIS Project Control

on:
  pull_request:
  push:
    branches:
      - main
      - 'work/**'
      - 'integration/**'
      - 'docs/**'

permissions:
  contents: read

jobs:
  project-control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate matrix and generated status
        run: python tools/project_status/generate_status.py --check

      - name: Validate G1 sensor-node discovery contract
        run: |
          python tools/hardware/validate_g1_sensor_node_discovery.py
          python -m unittest tests.test_g1_sensor_node_discovery -v
          python -m unittest tests.test_capture_g1_sensor_node -v
          python tools/hardware/validate_g1_physical_inventory.py
          python -m unittest tests.test_g1_physical_inventory -v
          python tools/hardware/validate_g1_g2_readiness.py
          python -m unittest tests.test_g1_g2_readiness -v

      - name: Validate G2 ICD and live-vertical contract
        run: |
          python tools/protocol/validate_avionix_icd.py --bundle docs/status/evidence/g2-arm64-consolidated-20260918/evidence.json
          python -m unittest tests.test_avionix_icd -v
          python tools/network/validate_g2_vertical_acceptance.py
          python -m unittest tests.test_g2_vertical_acceptance -v

      - name: Validate SkyView and EMS HMI contract
        run: |
          python tools/ui/validate_hmi_contract.py
          python -m unittest tests.test_avionix_hmi_contract -v
          python -m unittest tests.test_skyview_responsive -v
          python -m unittest tests.test_ems_state_presentation -v
          python -m unittest tests.test_ems_responsive_state_matrix -v
          python -m unittest tests.test_hmi_hardware_acceptance -v
          python -m unittest tests.test_assemble_hmi_hardware_evidence -v
          python -m unittest tests.test_hmi_golden_tools -v
          python tools/ui/validate_ems_state_presentation.py
          python tools/ui/validate_ems_responsive_state_matrix.py
          python tools/ui/validate_hmi_hardware_acceptance.py
          python tools/ui/validate_hmi_golden.py tests/golden/hmi
          python tools/ui/validate_hmi_golden.py tests/golden/skyview

      - name: Determine changed files
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD^"
            fi
          fi
          git diff --name-only "$BASE" HEAD > /tmp/efis_changed_files.txt
          cat /tmp/efis_changed_files.txt

      - name: Require project status update for subsystem changes
        run: |
          python tools/project_status/check_status_update.py --file-list /tmp/efis_changed_files.txt

      - name: Show generated summary
        run: cat docs/status/EFIS_NEXT_STATUS_GENERATED.md
