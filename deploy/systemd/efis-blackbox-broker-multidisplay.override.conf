[Service]
ExecStart=
ExecStart=/opt/efis-blackbox/bin/efis-blackbox-broker --mavlink-bind ${EFIS_MAVLINK_BIND} --mavlink-port ${EFIS_MAVLINK_PORT} --can-interface ${EFIS_SENSOR_CAN} --display 10.77.10.11 --display 10.77.10.13 --display-port ${EFIS_PFD_DDP_PORT} --engine-display ${EFIS_EDP_EMS_ADDRESS} --engine-port ${EFIS_EDP_EMS_PORT} --engine-simulation --source-node ${EFIS_BLACKBOX_NODE} --records /var/lib/blackbox/flight --rate-hz 20
