[Unit]
# The legacy unit sets StartLimitIntervalSec=0. Restore a finite guard so an
# unexpected failure mode cannot create another unbounded restart storm.
StartLimitIntervalSec=60s
StartLimitBurst=3

[Service]
# bbxnav exits 2 when receiver/configuration validation fails. This is a
# persistent precondition failure, not a transient daemon crash: keep NAV
# unavailable and visible instead of retrying every five seconds.
Restart=on-failure
RestartPreventExitStatus=2
RestartSec=5s
