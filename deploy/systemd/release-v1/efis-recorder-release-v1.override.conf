# CANDIDATE ONLY. Base unit: efis-recorder.service (user scope).
[Service]
WorkingDirectory=/home/efis/efis-next-current
ExecCondition=/usr/bin/python3 /usr/local/lib/efis-next/validate_release_manifest.py --manifest /home/efis/efis-next-current/release-manifest.json --release-root /home/efis/efis-next-current --expected-role RECORDER --expected-platform RPI5_AARCH64 --check-files
ExecStart=
# Rolling DEVELOPMENT recorder buffer: 24 GiB completed data, at least 12 GiB
# filesystem reserve, and never fewer than 120 completed one-minute segments.
ExecStart=/home/efis/efis-next-current/bin/efis-recorder /home/efis/.local/state/efis-next/records /home/efis/.local/state/efis-next/recorder.status --max-storage-bytes 25769803776 --min-free-bytes 12884901888 --minimum-completed-segments 120
StandardOutput=journal
StandardError=journal
