# CANDIDATE ONLY. Base unit: efis-recorder.service (user scope).
[Service]
WorkingDirectory=/home/efis/efis-next-current
ExecCondition=/usr/bin/python3 /usr/local/lib/efis-next/validate_release_manifest.py --manifest /home/efis/efis-next-current/release-manifest.json --release-root /home/efis/efis-next-current --expected-role RECORDER --expected-platform RPI5_AARCH64 --check-files
ExecStart=
ExecStart=/home/efis/efis-next-current/build-rpi5/efis-recorder /home/efis/.local/state/efis-next/records /home/efis/.local/state/efis-next/recorder.status
StandardOutput=journal
StandardError=journal
