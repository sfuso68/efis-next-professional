# CANDIDATE ONLY. Base unit: efis-next-mfd-direct.service.
[Unit]
ConditionPathExists=
ConditionPathExists=/home/pi/efis-next-current/bin/efis-pfd-qt

[Service]
ExecCondition=/usr/bin/python3 /usr/local/lib/efis-next/validate_release_manifest.py --manifest /home/pi/efis-next-current/release-manifest.json --release-root /home/pi/efis-next-current --expected-role MFD --expected-platform RPI5_AARCH64 --check-files
ExecStart=
ExecStart=/home/pi/efis-next-current/bin/efis-pfd-qt
# Logs are mutable state and must not be appended below the immutable release.
StandardOutput=journal
StandardError=journal
