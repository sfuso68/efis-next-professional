# CANDIDATE ONLY. Keeps the explicit engine-simulation flag for the bench feed.
[Service]
WorkingDirectory=/opt/efis-blackbox-current
ExecCondition=/usr/bin/python3 /usr/local/lib/efis-next/validate_release_manifest.py --manifest /opt/efis-blackbox-current/release-manifest.json --release-root /opt/efis-blackbox-current --expected-role BLACKBOX --expected-platform RPI5_AARCH64 --check-files
ExecStart=
ExecStart=/opt/efis-blackbox-current/bin/efis-blackbox-broker --mavlink-bind ${EFIS_MAVLINK_BIND} --mavlink-port ${EFIS_MAVLINK_PORT} --mavlink-source ${EFIS_MAVLINK_SOURCE} $EFIS_MAVLINK_OBSERVER_ARGS --mavlink-observer-port ${EFIS_MAVLINK_OBSERVER_PORT} --can-interface ${EFIS_SENSOR_CAN} $EFIS_DDP_DISPLAY_ARGS --display-port ${EFIS_PFD_DDP_PORT} --engine-display ${EFIS_EDP_EMS_ADDRESS} --engine-port ${EFIS_EDP_EMS_PORT} --engine-simulation --source-node ${EFIS_BLACKBOX_NODE} --records /var/lib/blackbox/flight --rate-hz 20
